<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" fill="none" class="logo-svg">
  <!-- Huvanti.com primary logo : mark + wordmark -->
  <defs>
    <linearGradient id="lmark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12573F"/>
      <stop offset="1" stop-color="#06261C"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <rect x="4" y="10" width="76" height="76" rx="22" fill="url(#lmark)" stroke="#6EE7B7" stroke-opacity="0.35"/>
  <rect x="26" y="28" width="9" height="40" rx="4.5" fill="#FFFFFF"/>
  <rect x="49" y="28" width="9" height="40" rx="4.5" fill="#FFFFFF"/>
  <path d="M35 48 C39 44.4, 45 44.4, 49 48 C45 51.6, 39 51.6, 35 48 Z" fill="#6EE7B7"/>
  <circle cx="62" cy="24" r="3" fill="#6EE7B7"/>
  <!-- Wordmark -->
  <text x="98" y="66" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="currentColor">Huvanti</text>
  <text x="310" y="66" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="500" letter-spacing="-0.5" fill="#34D399">.com</text>
</svg>
